# Production edge for the poker platform: ONE public origin.
#
#   https://poker.example.com/            -> web  (Next.js, private address)
#   https://poker.example.com/api/        -> API  (Express, private address)
#   https://poker.example.com/socket.io/  -> API  (Socket.io, incl. WebSocket upgrade)
#
# An alternative to deploy/Caddyfile; use one or the other. See
# deploy/README.md for the topology and docs/DEPLOYMENT.md for the rest.
# UNEXECUTED: written and reviewed by reading only; run `nginx -t -c <path>`
# before relying on it. Needs nginx >= 1.25.1 (`http2 on;`) and the stock
# limit_req / limit_conn modules.
#
# Replace before use (search for them):
#   poker.example.com        your public hostname
#   10.0.1.10:4000           private address of the API   (upstream poker_api)
#   10.0.1.11:3000           private address of the web   (upstream poker_web)
#   /etc/ssl/poker/...       certificate chain and key (e.g. from certbot)

# "nginx" in the official image; "www-data" on Debian/Ubuntu packages.
user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # Slow-client (slowloris) protection for ordinary requests. The Socket.io
    # location raises the proxy timeouts for long-polling and WebSockets.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 65s;
    # Default body cap; each location below sets its own, smaller where it can.
    client_max_body_size 64k;

    log_format edge escape=json '{"time":"$time_iso8601","remote":"$remote_addr","host":"$host",'
        '"request":"$request_method $uri","status":$status,"bytes":$body_bytes_sent,'
        '"rt":$request_time,"upstream":"$upstream_addr","urt":"$upstream_response_time","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log edge;
    error_log /var/log/nginx/error.log warn;

    # ---- Edge rate limiting (per client IP) -------------------------------
    # This nginx IS the edge, so $remote_addr is the real TCP peer and cannot be
    # spoofed with headers. If an L7 load balancer sits in front, configure
    # ngx_http_realip_module with set_real_ip_from <LB CIDR> ONLY (see
    # deploy/README.md); never trust X-Forwarded-For from arbitrary peers.
    # These limits shed floods before they reach Node; the API keeps its own
    # express-rate-limit, keyed on the client IP this edge forwards. Many real
    # players can share one IP (mobile carrier NAT): watch the 429 rate after
    # launch before tightening.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=socket:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # WebSocket upgrade: forward "Connection: upgrade" only when the client asked
    # to upgrade; otherwise send an EMPTY Connection header, which keeps the
    # upstream keepalive pool working (nginx would otherwise send "close").
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream poker_api {
        # Private address only; the API port must not be reachable from the
        # internet (it trusts forwarded headers from this proxy's address).
        server 10.0.1.10:4000 max_fails=3 fail_timeout=10s;
        # For several API instances, add them here AND configure REDIS_URL
        # (docs/DEPLOYMENT.md). With Socket.io long-polling, a session must
        # stay on one instance: enable `ip_hash;` (or a sticky cookie).
        keepalive 64;
    }

    upstream poker_web {
        server 10.0.1.11:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ---- TLS settings (Mozilla "intermediate") ----------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:poker_tls:10m;
    # Session tickets weaken forward secrecy unless the ticket key is rotated.
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    # ---- Port 80: ACME challenges and a redirect, nothing else -------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }
        location / {
            # Redirect to the canonical host, never to whatever Host the
            # client sent.
            return 301 https://poker.example.com$request_uri;
        }
    }

    # ---- Port 443, unknown names: refuse the handshake ----------------------
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # ---- Port 443: the one public origin ----------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name poker.example.com;

        ssl_certificate     /etc/ssl/poker/fullchain.pem;
        ssl_certificate_key /etc/ssl/poker/privkey.pem;

        # `always` so the headers are on error responses (4xx/5xx) too. Note:
        # nginx drops ALL inherited add_header lines in any block that defines
        # its own, so no location below may use add_header.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        proxy_hide_header X-Powered-By;

        limit_conn perip 60;

        # ---- Forwarded headers: OVERWRITE, never append ----
        # proxy_set_header REPLACES the client's value. In particular this uses
        # $remote_addr and NOT $proxy_add_x_forwarded_for, which would append to
        # a client-supplied X-Forwarded-For and let a client choose the IP the
        # API rate-limits, audits and geo-checks. The API honours these headers
        # only from this proxy's address (TRUSTED_PROXY_CIDRS).
        # They are all set HERE, at server level, because nginx drops every
        # inherited proxy_set_header in a block that defines one of its own;
        # no location below may use proxy_set_header.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # RFC 7239 Forwarded is not produced by this edge; an empty value
        # removes any client copy.
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # The readiness probe reports dependency state (database, Redis) and is
        # for the orchestrator on the private network only.
        # Regex, so it wins over the /api/ prefix and also covers sub-paths.
        location ~ ^/api/ready(/|$) {
            return 404;
        }

        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req zone=web burst=200 nodelay;
            client_max_body_size 64k;
            proxy_pass http://poker_api;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            limit_req zone=web burst=200 nodelay;
            # The API accepts at most 32 KiB of JSON.
            client_max_body_size 64k;
            proxy_pass http://poker_api;
        }

        location /socket.io/ {
            limit_req zone=socket burst=30 nodelay;
            limit_req zone=web burst=200 nodelay;
            # Socket.io messages are capped at 8 KiB by the API.
            client_max_body_size 64k;
            # Stream long-polling responses and WebSocket frames unbuffered.
            proxy_buffering off;
            proxy_request_buffering off;
            # Long WebSocket timeouts: a seated player's connection is idle
            # between hands. Socket.io pings every 25s, so a dead peer is still
            # detected by the application within ~45s; these only stop nginx
            # from cutting a healthy connection. Long-polling requests are
            # answered within ~45s, well inside this.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass http://poker_api;
        }

        location / {
            limit_req zone=web burst=200 nodelay;
            client_max_body_size 256k;
            proxy_pass http://poker_web;
        }
    }
}
